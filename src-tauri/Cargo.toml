[workspace]
members = [".", "crates/trm-core"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "TRM-Connect - modern SFTP/FTP/FTPS/SCP client"
authors = ["TRM-Connect contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
trm-core = { path = "crates/trm-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio-util = "0.7.19"
