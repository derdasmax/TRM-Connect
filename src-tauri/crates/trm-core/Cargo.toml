[package]
name = "trm-core"
version = "0.1.0"
description = "TRM-Connect core engine: connection manager, transfer protocols, crypto"
edition = "2021"
rust-version = "1.85"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
russh = { version = "0.63.1", features = ["aws-lc-rs"] }
russh-sftp = "2.4.0"
suppaftp = { version = "10", default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
keyring = "3.6.3"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.104"
thiserror = "2.0.20"
futures = "0.3.34"
log = "0.4"
base64 = "0.23.1"
tokio-util = "0.7.19"
async-trait = "0.1.92"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
